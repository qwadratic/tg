name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Lets the publish workflow reuse these exact gates instead of copying them.
  workflow_call:

# Cancel a superseded run rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and current. If the floor
        # breaks, engines is wrong and someone's install is broken.
        #
        # Node 20 is deliberately absent: pnpm 11 imports node:sqlite and needs
        # >= 22.13, so a Node 20 job cannot even install dependencies. Claiming
        # >= 20 in engines while being unable to test it is the kind of unbacked
        # promise this repo keeps finding in its own docs. Node 20 is EOL anyway.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json, so CI and
      # a contributor's laptop cannot drift apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile: CI must fail on a lockfile that disagrees with
      # package.json rather than quietly resolving something else.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Same gate as typecheck and in the same job, so the two cannot drift:
      # `any` and the type-checked rules fail here, not in review.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # The published artefact is dist/, so a green suite over uncompiled source
      # is not enough on its own.
      - name: Build
        run: pnpm run build

      # Guards the thing that actually bit us: the package once shipped tests,
      # the backlog and an 800kB demo recording to everyone who installed it.
      # Reads the structured file list, because the human-readable `npm notice`
      # lines are easy to write a pattern against that silently matches nothing.
      - name: Verify the package contents
        run: node scripts/check-package-contents.mjs

  # The gates above run against the source tree with pnpm. This runs against the
  # thing people actually get: the packed tarball, installed globally with npm,
  # driven in an empty directory. It is how the psst-missing and native-binding
  # problems were found by hand, now automated.
  smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Install the packed tarball globally, like a user would
        run: |
          TARBALL="$(npm pack --silent)"
          npm install -g "./$TARBALL"

      - name: Drive it in an empty directory
        run: |
          mkdir -p /tmp/ws && cd /tmp/ws

          test "$(tg --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          echo "version ok"

          # init must succeed with no psst, no vault and no session, and must
          # not connect. The runner has no psst, which is exactly the state a
          # new user is in.
          tg init --json > init.json
          cat init.json
          node -e "
            const s = require('/tmp/ws/init.json');
            const bad = [];
            if (s.gitignored !== true) bad.push('did not gitignore the data dir');
            if (s.hasSession !== false) bad.push('a fresh workspace claims a session');
            if (s.psst !== false) bad.push('reported psst as present on a runner without it');
            if (bad.length) { console.error(bad.join('; ')); process.exit(1) }
          "
          test -d data/archive && echo "init ok"

          # The offline guards must fire without a session or a network call.
          tg dump '@durov' 2>&1 | grep -q 'No usable Telegram session' && echo "session gate ok"
          tg dump 'has space' 2>&1 | grep -q 'Cannot use' && echo "reference gate ok"
          tg dump '@durоv' 2>&1 | grep -q 'non-ASCII' && echo "homoglyph gate ok"

          # Updates must be inert in CI, or a build agent swaps versions mid-run.
          tg update 2>&1 | grep -q 'skipped in CI' && echo "update gate ok"
        env:
          TG_NON_INTERACTIVE: '1'
